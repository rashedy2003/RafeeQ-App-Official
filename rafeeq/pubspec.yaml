name: Rafeeq
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.1+1
  path_provider: ^2.0.15
  path: ^1.8.3
  dio: ^5.9.1
  flutter_bloc: ^9.1.1
  google_fonts: ^8.0.2
  url_launcher: ^6.3.2
  country_picker: ^2.0.27
  flutter_secure_storage: ^10.0.0
  flutter_localizations:
    sdk: flutter   # صحح الاسم هنا
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# إعدادات الأيقونة
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/iconapp.jpeg"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/iconapp.jpeg"

flutter:
  uses-material-design: true
  generate: true   # مهم جدًا لتوليد AppLocalizations

  assets:
    - assets/images/